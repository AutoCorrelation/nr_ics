[project]
name = "nr-ics"
version = "0.1.0"
description = "Standard NR SSB references and PyTorch channel estimation experiments"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.4.6",
    "torch==2.9.1",
    "sionna-no-rt==2.2.0",
    "h5py>=3.15.1",
    "scipy>=1.15.3",
    "matplotlib>=3.10.8",
]

[project.scripts]
ssb-benchmark = "ssb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/ssb"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["python"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
